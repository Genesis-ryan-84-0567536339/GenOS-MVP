[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genos-mvp"
version = "0.1.0.dev0"
description = "GenOS MVP lifecycle and typed host reconnaissance foundation"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10,<5"]

[project.scripts]
genos = "genos.cli_mvp11:main"
genos-edge = "genos.edge_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genos = ["schemas/*.json", "web/*.html", "web/*.css", "web/*.js"]
