name: MVP-02 Fresh Host E2E

on:
  pull_request:
    paths:
      - "src/genos/**"
      - "tests/**"
      - "ci/fresh-host-e2e.sh"
      - ".github/workflows/fresh-host-e2e.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2404-native:
    name: ubuntu-24.04-amd64-native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          tested_sha="$(git rev-parse HEAD)"
          echo "tested_sha=${tested_sha}"
          test "${tested_sha}" = "${expected_sha}"

      - name: Install isolated VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            curl

      - name: Fresh host install, rerun, reboot acceptance
        id: fresh_host
        shell: bash
        run: bash ci/fresh-host-e2e.sh

      - name: Report failure without emitting unverified guest artifacts
        if: failure()
        shell: bash
        run: |
          echo "Fresh-host gate failed. Guest logs/evidence are intentionally not emitted because the in-run secret sanitation gate did not complete."

      - name: Upload sanitized fresh-host evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mvp02-fresh-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/genos-fresh-host/fresh-host-evidence.json
            ${{ runner.temp }}/genos-fresh-host/install.json
            ${{ runner.temp }}/genos-fresh-host/rerun.json
          if-no-files-found: ignore
          retention-days: 14
