name: Publisher OAuth Presence Check

on:
  pull_request:
    paths:
      - '.github/workflows/publisher-oauth-presence-check.yml'
  push:
    branches:
      - plan/mvp11-publisher-oauth-presence-check

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check configured state only
        shell: bash
        env:
          HAS_CLIENT_ID: ${{ secrets.GENOS_GOOGLE_DRIVE_OAUTH_CLIENT_ID != '' && 'true' || 'false' }}
          HAS_CLIENT_SECRET: ${{ secrets.GENOS_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_CLIENT_ID" == "true" && "$HAS_CLIENT_SECRET" == "true" ]]; then
            echo 'PUBLISHER_GOOGLE_OAUTH=CONFIGURED'
          elif [[ "$HAS_CLIENT_ID" == "false" && "$HAS_CLIENT_SECRET" == "false" ]]; then
            echo 'PUBLISHER_GOOGLE_OAUTH=MISSING_BOTH'
          else
            echo 'PUBLISHER_GOOGLE_OAUTH=PARTIAL_CONFIG'
          fi
