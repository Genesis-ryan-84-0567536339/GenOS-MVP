name: MVP Release Package

on:
  pull_request:
    paths:
      - '.github/workflows/release-package.yml'
      - 'INSTALL.md'
      - 'scripts/bootstrap.sh'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-package.yml'
      - 'INSTALL.md'
      - 'scripts/bootstrap.sh'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Build verified install bundle
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.GENOS_GOOGLE_DRIVE_OAUTH_CLIENT_ID }}
          GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GENOS_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p dist
          raw_archive="dist/genos-mvp-${TARGET_SHA}.tar"
          archive="${raw_archive}.gz"
          git archive --format=tar --output="$raw_archive" HEAD

          oauth_state="NOT_CONFIGURED_PR_BUILD"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ -z "${GOOGLE_DRIVE_OAUTH_CLIENT_ID}" || -z "${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET}" ]]; then
              echo "::error::Publisher-owned Google Drive OAuth application identity is missing. Refusing to publish a user release that would require per-user technical OAuth setup."
              exit 1
            fi
            generated="$(mktemp -d)"
            mkdir -p "$generated/distribution"
            python3 - "$generated/distribution/google-drive-oauth.json" <<'PY'
          from pathlib import Path
          import json, os, sys

          output = Path(sys.argv[1])
          payload = {
              "schema_version": "1.0",
              "provider": "google-drive",
              "flow": "limited-input-device",
              "client_id": os.environ["GOOGLE_DRIVE_OAUTH_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_DRIVE_OAUTH_CLIENT_SECRET"],
          }
          for key in ("client_id", "client_secret"):
              value = payload[key]
              if not isinstance(value, str) or not value.strip() or len(value) > 4096 or any(ch in value for ch in "\r\n\x00"):
                  raise SystemExit(f"invalid publisher OAuth {key}")
          output.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            tar --append --file="$raw_archive" -C "$generated" distribution/google-drive-oauth.json
            rm -rf "$generated"
            oauth_state="CONFIGURED"
          fi

          gzip -n "$raw_archive"
          cp scripts/bootstrap.sh dist/bootstrap.sh
          chmod 755 dist/bootstrap.sh
          (
            cd dist
            sha256sum "genos-mvp-${TARGET_SHA}.tar.gz" bootstrap.sh > SHA256SUMS
          )
          python3 - "$archive" "$oauth_state" <<'PY'
          from pathlib import Path, PurePosixPath
          import json, sys, tarfile

          archive = Path(sys.argv[1])
          oauth_state = sys.argv[2]
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              names = {member.name for member in members}
              assert 'src/genos/__init__.py' in names
              assert ('distribution/google-drive-oauth.json' in names) == (oauth_state == 'CONFIGURED')
              for member in members:
                  name = PurePosixPath(member.name)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert not member.issym() and not member.islnk() and not member.isdev()
                  assert member.isdir() or member.isfile()
          PY
          OAUTH_STATE="$oauth_state" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sha = os.environ['TARGET_SHA']
          archive = Path('dist') / f'genos-mvp-{sha}.tar.gz'
          bootstrap = Path('dist/bootstrap.sh')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          bootstrap_digest = hashlib.sha256(bootstrap.read_bytes()).hexdigest()
          metadata = {
              'schema_version': '1.1',
              'git_sha': sha,
              'archive': archive.name,
              'sha256': digest,
              'bootstrap': bootstrap.name,
              'bootstrap_sha256': bootstrap_digest,
              'certified_target': 'ubuntu-24.04-amd64-native',
              'release_state': 'RELEASE_CANDIDATE',
              'google_drive_oauth_distribution_state': os.environ['OAUTH_STATE'],
          }
          Path('dist/install-metadata.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified package artifact
        uses: actions/upload-artifact@v4
        with:
          name: genos-mvp-release-${{ env.TARGET_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified package artifact
        uses: actions/download-artifact@v4
        with:
          name: genos-mvp-release-${{ github.sha }}
          path: dist

      - name: Publish immutable GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          tag="mvp-rc-${short}"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('dist/install-metadata.json').read_text(encoding='utf-8'))
          if metadata.get('google_drive_oauth_distribution_state') != 'CONFIGURED':
              raise SystemExit('refusing to publish user prerelease without distribution Google Drive OAuth identity')
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "GenOS MVP Release Candidate ${short}" \
              --notes "Verified GenOS MVP release candidate for Ubuntu Server 24.04 LTS amd64 native. Download SHA256SUMS, install-metadata.json, the matching tar.gz and bootstrap.sh; verify both the archive and bootstrap checksums before installation. Google Drive uses the GenOS distribution OAuth application identity; each user only authorizes their own Google account through Mission Control. External Owner/Google/MCP authorization remains user-driven during final runtime acceptance."
          fi
