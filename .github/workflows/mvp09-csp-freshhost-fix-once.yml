name: MVP-09 CSP Fresh-host Fix Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mvp09-csp-freshhost-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'plan/mvp-09-mission-control-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/mvp-09-mission-control-ui
          fetch-depth: 0
      - name: Apply exact CSP-compatible UI and fresh-host fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_s: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          js = 'src/genos/web/app.js'
          replace_exact(js, 'class="panel inline-form" style="margin-bottom:14px"', 'class="panel inline-form spaced-form"')
          replace_exact(js, 'class="muted" style="font-size:10px"', 'class="muted compact-note"')
          replace_exact(js, 'class="form-grid" style="margin-top:12px"', 'class="form-grid space-top-sm"')
          replace_exact(js, 'class="grid connections" style="margin-top:14px"', 'class="grid connections space-top"')
          replace_exact(js, 'class="grid two" style="margin-top:14px"', 'class="grid two space-top"', expected=2)
          replace_exact(
              js,
              'const active = card.card_id === app.selectedCard ? " style=\\"border-color:#26d5ff\\"" : "";',
              'const selectedClass = card.card_id === app.selectedCard ? " selected-card" : "";',
          )
          replace_exact(
              js,
              'class="card-item" data-card="${esc(card.card_id)}"${active}',
              'class="card-item${selectedClass}" data-card="${esc(card.card_id)}"',
          )
          replace_exact(
              js,
              '<div class="progress"><span style="width:100%"></span></div>',
              '<progress class="progress-native" max="100" value="100">100%</progress>',
          )
          progress_expr = '${Math.max(0,Math.min(100,Number(j.progress_percent)||0))}'
          replace_exact(
              js,
              '<div class="progress"><span style="width:' + progress_expr + '%"></span></div>',
              '<progress class="progress-native" max="100" value="' + progress_expr + '">' + progress_expr + '%</progress>',
          )

          for path_s in (js, 'src/genos/web/index.html'):
              text = Path(path_s).read_text(encoding='utf-8')
              if 'style=' in text:
                  raise SystemExit(f'{path_s}: inline style remains')

          css_path = Path('src/genos/web/app.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '.progress-native{'
          if marker in css:
              raise SystemExit('progress-native CSS already exists unexpectedly')
          css += '''\n.spaced-form{margin-bottom:14px}.compact-note{font-size:10px}.space-top{margin-top:14px}.space-top-sm{margin-top:12px}.card-item.selected-card{border-color:var(--cyan)}\n.progress-native{display:block;width:100%;height:12px;margin-top:8px;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#06101a}\n.progress-native::-webkit-progress-bar{background:#06101a}.progress-native::-webkit-progress-value{background:var(--cyan)}.progress-native::-moz-progress-bar{background:var(--cyan)}\n'''
          css_path.write_text(css, encoding='utf-8')

          safe_assert = "assert 'frame-ancestors' in mission_csp and 'none' in mission_csp, mission_csp"
          for path_s in ('ci/fresh-host-e2e.sh', 'ci/fresh-host-mvp03-e2e.sh'):
              replace_exact(path_s, 'assert "frame-ancestors \'none\'" in mission_csp, mission_csp', safe_assert)
          PY
          python3 -m compileall -q src ci/mvp09_browser_e2e.py
          ! grep -R 'style=' src/genos/web/index.html src/genos/web/app.js
          grep -q '.progress-native{' src/genos/web/app.css
          grep -q "assert 'frame-ancestors' in mission_csp and 'none' in mission_csp" ci/fresh-host-e2e.sh
          grep -q "assert 'frame-ancestors' in mission_csp and 'none' in mission_csp" ci/fresh-host-mvp03-e2e.sh
          git diff --check
      - name: Commit product and gate fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'genos-plan-ci'
          git config user.email 'genos-plan-ci@users.noreply.github.com'
          git add src/genos/web/app.js src/genos/web/app.css ci/fresh-host-e2e.sh ci/fresh-host-mvp03-e2e.sh
          git commit -m 'fix: keep Mission Control CSP strict and repair fresh-host assertion'
          git push origin HEAD:plan/mvp-09-mission-control-ui
