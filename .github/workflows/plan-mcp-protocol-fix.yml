name: PLAN MCP Protocol Fix

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/plan-mcp-protocol-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Apply and verify protocol fix
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/plan_mcp_protocol_fix.py
          PYTHONPATH=src python3 -m compileall -q src/genos tests
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_mvp07*.py' -v
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PLAN MCP Protocol Fix'
          git config user.email 'genesis.corp.os@gmail.com'
          git rm ci/plan_mcp_protocol_fix.py
          git add -A
          git commit -m 'fix(mvp07): align MCP 2026 request envelope and discovery'
          git push origin HEAD:${{ github.head_ref }}
