name: MVP-07 Kanban Drive MCP Hub Contract

on:
  pull_request:
    paths:
      - 'src/genos/kanban*.py'
      - 'src/genos/artifact_store.py'
      - 'src/genos/drive_collab.py'
      - 'src/genos/mcp_*.py'
      - 'src/genos/install.py'
      - 'src/genos/product_api.py'
      - 'src/genos/cli.py'
      - 'src/genos/core_service.py'
      - 'ci/fresh-host-e2e.sh'
      - 'tests/test_mvp07*.py'
      - '.github/workflows/mvp07-kanban-drive-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kanban-drive-mcp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
      - name: Compile MVP-07 surfaces
        run: PYTHONPATH=src python -m compileall -q src/genos tests
      - name: Kanban Drive and unified MCP contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_mvp07*.py' -v
      - name: Authority and secret-boundary guard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from genos.kanban_store import _clean_json, KanbanStoreError
          from genos.mcp_store import normalize_endpoint, scope_allows, McpStoreError

          for key in ('access_token', 'refresh_token', 'client_secret', 'raw_secret', 'password'):
              try:
                  _clean_json({key: 'fixture-secret'})
              except KanbanStoreError:
                  pass
              else:
                  raise AssertionError(f'forbidden Card event credential field accepted: {key}')

          try:
              normalize_endpoint('https://user:secret@example.com/mcp')
          except McpStoreError:
              pass
          else:
              raise AssertionError('MCP endpoint embedded credential accepted')

          assert scope_allows(['genos.*'], 'genos.cards.list')
          assert not scope_allows(['genos.cards.list'], 'genos.cards.transition')
          print('MVP07_SECRET_AUTHORITY_GUARD_PASS')
          PY
          grep -R "remote_role.*collaboration-replica" -n src/genos/drive_collab.py >/dev/null
          ! grep -R "shell=True" -n src/genos/mcp_*.py
          echo 'MVP07_AUTHORITY_GUARD_PASS'
