name: MVP-06 External Google Drive E2E

on:
  pull_request:
    paths:
      - "src/genos/drive_*.py"
      - "src/genos/report_*.py"
      - "src/genos/auth_service.py"
      - "src/genos/product_store.py"
      - "src/genos/secret_provider.py"
      - "ci/mvp06-external-drive-e2e.py"
      - ".github/workflows/mvp06-external-drive-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-drive-e2e:
    name: external-drive-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GENOS_MVP06_DRIVE_CREDENTIAL: ${{ secrets.GENOS_MVP06_DRIVE_CREDENTIAL }}
      GENOS_MVP06_EXTERNAL_EVIDENCE: ${{ runner.temp }}/mvp06-external-drive-evidence.json
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"

      - name: Detect external GenOS credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GENOS_MVP06_DRIVE_CREDENTIAL:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GenOS external Drive credential: CONFIGURED"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GenOS external Drive credential: NEEDS_EXTERNAL_GENOS_CREDENTIAL"
          fi

      - name: Record truthful external-auth gate
        if: steps.credential.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": "1.0",
              "state": "NEEDS_EXTERNAL_GENOS_CREDENTIAL",
              "tested_git_sha": os.environ["GITHUB_HEAD_SHA"],
              "remote_mutation": False,
          }
          path = Path(os.environ["GENOS_MVP06_EXTERNAL_EVIDENCE"])
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("GENOS_MVP06_EXTERNAL_DRIVE_E2E_NEEDS_EXTERNAL_GENOS_CREDENTIAL")
          PY

      - name: Prepare PostgreSQL SecretRef authority
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          if ! sudo -u postgres psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname='${USER}'" | grep -qx 1; then
            sudo -u postgres createuser --superuser "${USER}"
          fi
          sudo -u postgres dropdb --if-exists genos
          sudo -u postgres createdb -O "${USER}" genos
          psql -d genos -Atqc 'SELECT 1' | grep -qx 1

      - name: Run GenOS SecretRef to real Google Drive acceptance
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 ci/mvp06-external-drive-e2e.py

      - name: Upload sanitized external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp06-external-drive-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mvp06-external-drive-evidence.json
          if-no-files-found: error
          retention-days: 14
