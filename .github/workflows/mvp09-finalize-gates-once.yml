name: MVP-09 Finalize Gates Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mvp09-finalize-gates-once.yml
      - ci/mvp09_browser_e2e.py
      - ci/fresh-host-e2e.sh
      - ci/fresh-host-mvp03-e2e.sh
      - src/genos/install.py
      - src/genos/mission_control.py
      - src/genos/web/app.js

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'plan/mvp-09-mission-control-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/mvp-09-mission-control-ui
          fetch-depth: 0
      - name: Patch approved MVP-09 gate truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_s: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "ci/mvp09_browser_e2e.py",
              'page.get_by_text("Browser fixture card", exact=True).wait_for()',
              'page.get_by_role("heading", name="Browser fixture card", exact=True).wait_for()',
          )

          old_ui_probe = """try:
              urllib.request.urlopen('http://127.0.0.1:17882/', timeout=5)
              raise AssertionError('Mission Control root unexpectedly returned success before MVP-08')
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, exc.code
              exc.close()"""
          old_ui_probe_mvp03 = """try:
              urllib.request.urlopen('http://127.0.0.1:17882/', timeout=5)
              raise AssertionError('Mission Control root unexpectedly returned success before MVP-08')
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, exc.code"""
          new_ui_probe = """with urllib.request.urlopen('http://127.0.0.1:17882/', timeout=5) as response:
              mission_html=response.read().decode('utf-8')
              mission_status=response.status
              mission_csp=response.headers.get('Content-Security-Policy', '')
              mission_nosniff=response.headers.get('X-Content-Type-Options', '')
          assert mission_status == 200, mission_status
          assert 'GenOS Mission Control' in mission_html, mission_html[:200]
          assert \"frame-ancestors 'none'\" in mission_csp, mission_csp
          assert mission_nosniff == 'nosniff', mission_nosniff
          with urllib.request.urlopen('http://127.0.0.1:17882/assets/app.js', timeout=5) as response:
              mission_asset=response.read()
              mission_asset_status=response.status
          assert mission_asset_status == 200, mission_asset_status
          assert mission_asset, 'Mission Control app.js is empty'"""
          replace_exact("ci/fresh-host-e2e.sh", old_ui_probe, new_ui_probe)
          replace_exact("ci/fresh-host-mvp03-e2e.sh", old_ui_probe_mvp03, new_ui_probe)

          replace_exact(
              "src/genos/install.py",
              '"mission_control_ui": "NOT_IMPLEMENTED_BEFORE_MVP_08_VISUAL_APPROVAL"',
              '"mission_control_ui": "READY"',
          )
          replace_exact(
              "ci/fresh-host-e2e.sh",
              "NOT_IMPLEMENTED_BEFORE_MVP_08_VISUAL_APPROVAL",
              "READY",
              expected=2,
          )
          replace_exact(
              "ci/fresh-host-mvp03-e2e.sh",
              "NOT_IMPLEMENTED_BEFORE_MVP_08_VISUAL_APPROVAL",
              "READY",
              expected=1,
          )

          # One-time MCP credential must leave the DOM regardless of how the dialog closes.
          close_line = 'document.getElementById("close-token").addEventListener("click", () => { document.getElementById("one-time-token").textContent=""; document.getElementById("one-time-dialog").close(); });'
          close_hardened = close_line + '\ndocument.getElementById("one-time-dialog").addEventListener("close", () => { document.getElementById("one-time-token").textContent=""; });'
          replace_exact("src/genos/web/app.js", close_line, close_hardened)

          # BaseHTTPRequestHandler's default formatted message can include query strings; log only sanitized route metadata.
          old_log = '''    def log_message(self, fmt: str, *args: object) -> None:\n        # Fixed route paths are safe to record; credentials, headers and bodies\n        # are never logged by this service.\n        print(json.dumps({"event": "mission_control_http", "message": fmt % args}, ensure_ascii=False), flush=True)'''
          new_log = '''    def log_message(self, fmt: str, *args: object) -> None:\n        # Log only sanitized route metadata. Never record query strings, headers\n        # or request bodies because callers can place sensitive text there.\n        path = self.path.split("?", 1)[0]\n        print(json.dumps({"event": "mission_control_http", "method": self.command, "path": path}, ensure_ascii=False), flush=True)'''
          replace_exact("src/genos/mission_control.py", old_log, new_log)
          PY
          python3 -m compileall -q src ci/mvp09_browser_e2e.py
          grep -q '"mission_control_ui": "READY"' src/genos/install.py
          grep -q "frame-ancestors 'none'" ci/fresh-host-e2e.sh
          grep -q "frame-ancestors 'none'" ci/fresh-host-mvp03-e2e.sh
          grep -q 'one-time-dialog.*addEventListener("close"' src/genos/web/app.js
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git config user.name "genos-plan-ci"
          git config user.email "genos-plan-ci@users.noreply.github.com"
          git add ci/mvp09_browser_e2e.py ci/fresh-host-e2e.sh ci/fresh-host-mvp03-e2e.sh src/genos/install.py src/genos/mission_control.py src/genos/web/app.js
          git commit -m "fix: align Mission Control gates and harden transient credentials"
          git push origin HEAD:plan/mvp-09-mission-control-ui
