name: MVP-04 Tmux Auth Bridge

on:
  pull_request:
    paths:
      - "src/genos/agent_auth.py"
      - "src/genos/agent_runtime.py"
      - "src/genos/agent_secure_runtime.py"
      - "src/genos/product_api.py"
      - "src/genos/cli.py"
      - "tests/test_mvp04*.py"
      - "ci/mvp04-auth-contract-e2e.py"
      - ".github/workflows/mvp04-auth-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tmux-auth-bridge:
    name: tmux-auth-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_sha=$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install tmux
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux

      - name: Run auth bridge unit suite
        shell: bash
        run: PYTHONPATH=src python3 -m unittest tests.test_mvp04_auth -v

      - name: Run real tmux auth bridge contract
        shell: bash
        run: PYTHONPATH=src python3 ci/mvp04-auth-contract-e2e.py
