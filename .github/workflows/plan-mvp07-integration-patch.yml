name: PLAN MVP-07 Finalize Typed Integration

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/plan-mvp07-integration-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Apply typed source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/plan_mvp07_finalize.py
          PYTHONPATH=src python3 -m compileall -q src/genos tests
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_mvp07*.py' -v
          PYTHONPATH=src python3 - <<'PY'
          from genos.cli import build_parser
          assert build_parser().parse_args(['kanban','sync','--json']).kanban_command == 'sync'
          assert build_parser().parse_args(['mcp','principal-create','--name','agent','--scope','genos.*','--json']).mcp_command == 'principal-create'
          PY
      - name: Commit reviewed generated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PLAN MVP-07 Finalizer'
          git config user.email 'genesis.corp.os@gmail.com'
          git rm ci/plan_mvp07_finalize.py .github/workflows/plan-mvp07-integration-patch.yml
          git add -A
          git commit -m 'feat(mvp07): wire Kanban and unified MCP Hub lifecycle'
          git push origin HEAD:${{ github.head_ref }}
