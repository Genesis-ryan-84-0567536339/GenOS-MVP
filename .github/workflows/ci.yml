name: MVP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mvp01:
    name: mvp01-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          tested_sha="$(git rev-parse HEAD)"
          echo "tested_sha=${tested_sha}"
          test "${tested_sha}" = "${expected_sha}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile package
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Unit and fixture tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Read-only lifecycle smoke
        run: |
          PYTHONPATH=src python -m genos status --json
          PYTHONPATH=src python -m genos recon --json > /tmp/genos-recon.json
          PYTHONPATH=src python -m genos doctor --json > /tmp/genos-doctor.json
          PYTHONPATH=src python -m genos repair --action restart-service --target worker --plan-only --json > /tmp/genos-repair-plan.json
          python - <<'PY'
          import json
          recon = json.load(open('/tmp/genos-recon.json', encoding='utf-8'))
          doctor = json.load(open('/tmp/genos-doctor.json', encoding='utf-8'))
          repair = json.load(open('/tmp/genos-repair-plan.json', encoding='utf-8'))
          assert recon['read_only'] is True
          assert recon['observations']
          assert doctor['read_only'] is True
          assert doctor['authority'] == 'genos-observability-v1'
          assert doctor['observations']
          assert repair['plan_only'] is True
          assert repair['plan']['operation'] == ['systemctl', 'restart', 'genos-worker.service']
          PY
